# Publishes the landing page (site/) to GitHub Pages on every push to main that touches it.
# One-time setup: Settings › Pages › Source: GitHub Actions.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v5
        with:
          path: ./site
        env:
          SITE: https://muffindevx.github.io
          BASE: /scrinium
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
