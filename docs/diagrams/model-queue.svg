<path d="M 472,128 L 472,108 Q 472,100 464,100 L 304,100 Q 296,100 296,108 L 296,128" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#model-queue-arrow)"/>
<path d="M 504,176 L 616,176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#model-queue-arrow)"/>
