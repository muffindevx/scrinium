<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="424" viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-queue-title model-queue-desc" id="model-queue-root">
<title id="model-queue-title">Who uses the model, and in what order</title>
<desc id="model-queue-desc">Fan-in queue: three triggers feed one analysis thread that sends one batch at a time to the single model slot; questions go first and phase 2 yields its turn.</desc>
<defs>
      <style>#model-queue-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #model-queue-root { font-family: var(--font-sans); color: var(--color-ink); }
      #model-queue-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#model-queue-root .diagram-container { overflow-x: visible; }
}</style><marker id="model-queue-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="model-queue-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="model-queue-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
