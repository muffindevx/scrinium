      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #data-boundaries-root { font-family: var(--font-sans); color: var(--color-ink); }
      #data-boundaries-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#data-boundaries-root .diagram-container { overflow-x: visible; }
