<title id="data-boundaries-title">What stays on your machine</title>
<desc id="data-boundaries-desc">Data-flow boundaries: the browser, sources, local models, stores and keyring sit on the user's machine; a model provider, Linear or Jira, and a Git remote are reached only when the person turns them on.</desc>
