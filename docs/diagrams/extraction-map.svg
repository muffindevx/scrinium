      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #extraction-map-root { font-family: var(--font-sans); color: var(--color-ink); }
      #extraction-map-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#extraction-map-root .diagram-container { overflow-x: visible; }
