<title id="extraction-map-title">Phase 1: from code to a rule</title>
<desc id="extraction-map-desc">Rule extraction phase 1: function symbols are scored by decision lines, cut into windows, queued, batched, and answered by the model; each rule is stored with one citation.</desc>
