      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #sync-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sync-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sync-flow-root .diagram-container { overflow-x: visible; }
