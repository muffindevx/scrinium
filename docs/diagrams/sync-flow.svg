<svg width="960" height="408" viewBox="0 0 960 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-flow-title sync-flow-desc" id="sync-flow-root">
<title id="sync-flow-title">Syncing a source</title>
<desc id="sync-flow-desc">Sync flow: a source is read and filtered, new revisions, chunks and code symbols are written in one transaction, then vectors and the rule watch follow.</desc>
