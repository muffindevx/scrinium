<svg width="960" height="400" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="question-flow-title question-flow-desc" id="question-flow-root">
<title id="question-flow-title">Answering a question</title>
<desc id="question-flow-desc">Question flow: three searches are merged by rank fusion, the best sources go to the model, and each claim is kept only if it cites a source it received.</desc>
