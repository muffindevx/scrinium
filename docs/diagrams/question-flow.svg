      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #question-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #question-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#question-flow-root .diagram-container { overflow-x: visible; }
