<title id="runtime-architecture-title">Scrinium on one machine</title>
<desc id="runtime-architecture-desc">Architecture of the Scrinium runtime: the browser talks to the API, background runners share one local model through LlmService, and data is kept in SQLite, vectors included.</desc>
