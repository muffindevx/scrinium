<rect x="72" y="80" width="464" height="280" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.025"/><rect x="84" y="74" width="268" height="12" rx="2" fill="#f5f5f5"/><text x="218.0" y="83" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">±6-LINE WINDOW · LINES 8–23 · WHAT PHASE 1 READS</text>
<rect x="104" y="120" width="400" height="208" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03"/><rect x="116" y="114" width="244" height="12" rx="2" fill="#f5f5f5"/><text x="238.0" y="123" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 2 CONTEXT · CITATION ±4 · LINES 10–21</text>
