<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="424" viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rule-anatomy-title rule-anatomy-desc" id="rule-anatomy-root">
<title id="rule-anatomy-title">What is read, and what is kept, from one function</title>
<desc id="rule-anatomy-desc">Nested view of one 90-line function: the model reads only windows around decisions, phase 2 reads the citation plus four lines, and only the citation is stored, with no link between rules.</desc>
<defs>
      <style>#rule-anatomy-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #rule-anatomy-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rule-anatomy-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#rule-anatomy-root .diagram-container { overflow-x: visible; }
}</style><marker id="rule-anatomy-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="rule-anatomy-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="rule-anatomy-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
