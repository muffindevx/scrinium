<rect x="568" y="232" width="320" height="128" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.025"/><rect x="580" y="226" width="164" height="12" rx="2" fill="#f5f5f5"/><text x="662.0" y="235" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">±6-LINE WINDOW · LINES 70–71</text>
<rect x="136" y="168" width="336" height="112" rx="6" fill="#f5f5f5"/><rect x="136" y="168" width="336" height="112" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><rect x="144" y="176" width="28" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/><text x="158.0" y="185" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CITE</text><text x="304.0" y="228.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Rule citation · lines 14–17</text><text x="304.0" y="244.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stored · the only lines the UI shows</text>
