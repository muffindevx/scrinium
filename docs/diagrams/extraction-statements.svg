      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #extraction-statements-root { font-family: var(--font-sans); color: var(--color-ink); }
      #extraction-statements-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#extraction-statements-root .diagram-container { overflow-x: visible; }
