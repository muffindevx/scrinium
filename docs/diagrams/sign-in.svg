<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sign-in-title sign-in-desc" id="sign-in-root">
<title id="sign-in-title">Signing in with the launch link</title>
<desc id="sign-in-desc">Sequence of the local sign-in: the runtime reserves its port, issues a single-use token, opens the link, redeems it once and grants a session cookie; writes then carry a CSRF token.</desc>
<defs>
      <style>#sign-in-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #sign-in-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sign-in-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sign-in-root .diagram-container { overflow-x: visible; }
}</style><marker id="sign-in-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="sign-in-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="sign-in-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
