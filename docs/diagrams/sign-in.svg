<line x1="480" y1="96" x2="480" y2="448" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
<line x1="792" y1="96" x2="792" y2="448" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
<path d="M 168,128 L 198,128 Q 204,128 204,134 L 204,146 Q 204,152 198,152 L 172,152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sign-in-arrow)"/>
<path d="M 168,184 L 480,184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sign-in-arrow)"/>
<path d="M 168,224 L 792,224" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sign-in-arrow)"/>
<path d="M 792,264 L 168,264" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sign-in-arrow-link)"/>
<path d="M 168,304 L 480,304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sign-in-arrow)"/>
<path d="M 168,344 L 792,344" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#sign-in-arrow-accent)"/>
<path d="M 792,384 L 168,384" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sign-in-arrow-link)"/>
<path d="M 792,424 L 168,424" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sign-in-arrow-link)"/>
<rect x="220.0" y="134" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="258" y="143" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESERVE PORT</text>
<rect x="268.0" y="164" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="324.0" y="173" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ISSUE TOKEN · 120 S</text>
<rect x="276.0" y="204" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="324.0" y="213" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OPEN LAUNCH LINK</text>
<rect x="588.0" y="244" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="636.0" y="253" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GET /AUTH/LAUNCH</text>
<rect x="290.0" y="284" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="324.0" y="293" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REDEEM ONCE</text>
<rect x="576.0" y="324" width="120" height="12" rx="2" fill="#f5f5f5"/><text x="636.0" y="333" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">303 + SESSION COOKIE</text>
<rect x="592.0" y="364" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="636.0" y="373" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GET CSRF TOKEN</text>
<rect x="576.0" y="404" width="120" height="12" rx="2" fill="#f5f5f5"/><text x="636.0" y="413" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITES + CSRF HEADER</text>
<rect x="72" y="40" width="192" height="56" rx="6" fill="#f5f5f5"/><rect x="72" y="40" width="192" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="80" y="48" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/><text x="92.0" y="57" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text><text x="168.0" y="72.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">scrinium start</text><text x="168.0" y="88.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CLI + runtime</text>
<rect x="384" y="40" width="192" height="56" rx="6" fill="#f5f5f5"/><rect x="384" y="40" width="192" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/><rect x="392" y="48" width="24" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/><text x="404.0" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MEM</text><text x="480.0" y="72.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Session manager</text><text x="480.0" y="88.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">memory only</text>
<rect x="696" y="40" width="192" height="56" rx="6" fill="#f5f5f5"/><rect x="696" y="40" width="192" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/><rect x="704" y="48" width="20" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/><text x="714.0" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text><text x="792.0" y="72.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Browser</text><text x="792.0" y="88.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">your tab</text>
<line x1="40" y1="464" x2="920" y2="464" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/><text x="40" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text><line x1="40" y1="498" x2="68" y2="498" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sign-in-arrow-link)"/><text x="76" y="501" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Browser request</text><line x1="180" y1="498" x2="208" y2="498" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sign-in-arrow)"/><text x="216" y="501" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Internal call</text><line x1="308" y1="498" x2="336" y2="498" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#sign-in-arrow)"/><text x="344" y="501" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Opens the link</text><line x1="440" y1="498" x2="468" y2="498" stroke="#bf4520" stroke-width="1.2" marker-end="url(#sign-in-arrow-accent)"/><text x="476" y="501" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Session granted</text>
</svg>
